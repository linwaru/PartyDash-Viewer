name: Windows portable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: party-dash-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $versionText = (& python -c "from version import VERSION; print(VERSION)").Trim()
          if ($versionText -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION is invalid in version.py.' }
          "version=$versionText" >> $env:GITHUB_OUTPUT
          "commit=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT

      - run: ./build.ps1
        shell: pwsh

      - name: Validate packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/PartyDashViewer/PartyDashViewer.exe -ArgumentList --self-test -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Executable self-test failed' }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $archive = Get-Item "dist/PartyDashViewer-v${{ steps.version.outputs.version }}-Windows-x64.zip"
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: PartyDashViewer-v${{ steps.version.outputs.version }}-Windows-x64
          path: |
            dist/PartyDashViewer-v${{ steps.version.outputs.version }}-Windows-x64.zip
            dist/SHA256SUMS.txt

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: PartyDashViewer-v${{ needs.build.outputs.version }}-Windows-x64
          path: release

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to publish."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            release/*.zip \
            release/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --generate-notes \
            --title "PartyDash Viewer $RELEASE_TAG"
